# Serve the checked-out repo at https://ci4o2.zapto.org/life/ — no copying of files.
#
# Drop this inside the existing `server { ... }` block for ci4o2.zapto.org, either by
# pasting it or with:  include /home/ci4/src/life/deploy/nginx-life.conf;
#
# The regex block MUST stay above the prefix block: nginx tries regex locations first,
# which is what makes the deny win.

# Repo internals. Serving a git checkout directly exposes .git — anyone can then clone
# the full working tree and history from the web root. Also hides build output, the Rust
# sources, and the agent/deploy docs: all are on GitHub anyway, so this is about keeping
# the site to the simulations, not about keeping them secret.
location ~ ^/life/(\.|crates/|target/|node_modules/|docs/|deploy/|CLAUDE\.md) {
    return 404;
}

location /life/ {
    alias /home/ci4/src/life/;
    index index.html;

    # no directory listing: index.html is the entry point
    autoindex off;
    try_files $uri $uri/ =404;

    # the pages are edited and re-pulled often, so make browsers revalidate rather than
    # serve a stale copy. nginx still answers 304 from ETag/Last-Modified, so it is cheap.
    add_header Cache-Control "no-cache";

    gzip on;
    # text/html is always gzipped and must not be listed here — nginx warns if it is
    gzip_types text/css application/javascript;
    gzip_min_length 1024;
}
